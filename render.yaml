# Render Blueprint: dashboard.render.com > New > Blueprint > pick this repo. Leave optional keys empty if unused.
services:
  - type: web
    name: dreamjob
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"          # free plan has 512 MB RAM and 0.1 CPU
      - key: ARBEITNOW_PAGES
        value: "3"
      # Behind the Vercel proxy (dreamjob-sepia.vercel.app): Vercel + Render's own proxy = 2 hops
      - key: TRUSTED_PROXY_HOPS
        value: "2"
      - key: JSEARCH_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false
      - key: CAREERJET_API_KEY
        sync: false
      # Payments (optional). Secrets: fill them in on the Render dashboard, never in this file.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PASS_SECRET
        generateValue: true
      - key: AUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SITE_URL
        value: https://dreamjob-sepia.vercel.app
      - key: CONTACT_EMAIL
        sync: false
      - key: BUSINESS_NAME
        value: DreamJob
