# Render Blueprint: New > Blueprint > pick this repo.
services:
  - type: web
    name: dreamjob
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "10000"
      - key: WEB_CONCURRENCY
        value: "1"          # free plan has 512 MB RAM and 0.1 CPU
      - key: ARBEITNOW_PAGES
        value: "3"
      - key: JSEARCH_API_KEY
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: JOOBLE_API_KEY
        sync: false
      - key: CAREERJET_API_KEY
        sync: false
      # Payments (optional). Secrets: fill them in on the Render dashboard, never in this file.
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: PASS_SECRET
        generateValue: true
      - key: CONTACT_EMAIL
        sync: false
      - key: BUSINESS_NAME
        value: DreamJob
